name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Ada Quality
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ada_quality

      - name: Check out database
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/database
          ref: 27842fcc1e92b4e275f36ab98ce2c6dd5aa32e0d
          path: database

      - name: Check out project_tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/project_tools
          ref: 4f5357c7c7e8e175054e6f2cb72c302409f371c8
          path: project_tools

      - name: Check out jsonlib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/jsonlib
          ref: 24a1b18a7be19bb65725d8114c4f069658ced614
          path: jsonlib

      - name: Check out terminal_styles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/terminal_styles
          ref: da097e330169ea5d3030efd0207f313ae6262a65
          path: terminal_styles

      - name: Check out messages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/messages
          ref: 6d092f9590c6b0cb0d7704ce20c33b3ac76b8d14
          path: messages

      - name: Check out regexp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/regexp
          ref: f660333a314f3c610bb255478ac86656e2fd0c4c
          path: regexp

      - name: Check out i18n
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/i18n
          ref: 21d4d191f1d90a16248b71dfc54b4384502cf658
          path: i18n

      - name: Check out cryptolib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/cryptolib
          ref: 2e5c415f65fd49c2a496c97813740fa9b83e02fa
          path: cryptolib

      - name: Restore Alire and compiled-build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/alire
            ~/.local/share/alire
            */bin
            */lib
            */obj
            */tests/bin
            */tests/obj
          key: ada-quality-${{ runner.os }}-gnat-15.2.1-${{ hashFiles('**/*.adb', '**/*.ads', '**/*.gpr', '**/alire.toml', '**/.github/workflows/ci.yml') }}

      - name: Set up Alire
        uses: alire-project/setup-alire@1ff7d9224297858cc9ecce29b08bc6109f93e49a # v6
        with:
          version: 2.1.0

      - name: Resolve sibling crates
        working-directory: ada_quality
        shell: bash
        run: |
          cp alire.toml "${RUNNER_TEMP}/ada_quality-alire.toml"
          cp tests/alire.toml "${RUNNER_TEMP}/ada_quality-tests-alire.toml"
          restore_manifests() {
            cp "${RUNNER_TEMP}/ada_quality-alire.toml" alire.toml
            cp "${RUNNER_TEMP}/ada_quality-tests-alire.toml" tests/alire.toml
          }
          trap restore_manifests EXIT
          cat >> alire.toml <<'TOML'

          [[pins]]
          database = { path = "../database" }
          cryptolib = { path = "../cryptolib" }
          project_tools = { path = "../project_tools" }
          jsonlib = { path = "../jsonlib" }
          terminal_styles = { path = "../terminal_styles" }
          messages = { path = "../messages" }
          regexp = { path = "../regexp" }
          i18n = { path = "../i18n" }
          TOML
          alr -n update
          alr -n settings --set update.manually_only true
          cat >> tests/alire.toml <<'TOML'

          [[pins]]
          database = { path = "../../database" }
          cryptolib = { path = "../../cryptolib" }
          project_tools = { path = "../../project_tools" }
          jsonlib = { path = "../../jsonlib" }
          terminal_styles = { path = "../../terminal_styles" }
          messages = { path = "../../messages" }
          regexp = { path = "../../regexp" }
          i18n = { path = "../../i18n" }
          TOML
          alr -n -C tests update
          alr -n -C tests settings --set update.manually_only true
          restore_manifests
          trap - EXIT

      - name: Show selected toolchain
        working-directory: ada_quality
        run: alr -n exec -- gnatls --version

      - name: Validation build
        working-directory: ada_quality
        run: alr -n build --validation

      - name: Build AUnit suite
        working-directory: ada_quality
        run: alr -n -C tests build

      - name: Complete coverage gate
        working-directory: ada_quality
        env:
          # Measure the checkout independently without replacing reviewed
          # evidence with runner-specific execution counts.
          ADA_QUALITY_INTERNAL_COVERAGE_OUTPUT_DIR: ${{ runner.temp }}/ada-quality-coverage
        run: alr -n exec -- ./bin/coverage

      - name: Release structure gate
        # This is also the single non-instrumented AUnit execution in CI.
        working-directory: ada_quality
        run: alr -n exec -- ./bin/check_all

      - name: Verify tracked evidence is current
        working-directory: ada_quality
        run: git diff --exit-code
